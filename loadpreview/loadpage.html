<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onlinegame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header .meta {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            /* 让预览卡片根据视口伸展，iframe 可用空间为卡片高度 */
            height: 80vh;
        }

        /* 加载状态 */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 16px;
        }

        /* SDK信息显示 */
        .sdk-info {
            display: none;
            padding: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .info-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #667eea;
        }

        .info-item .label {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .info-item .value {
            color: #666;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* 游戏预览容器 */
        .game-preview-container {
            display: none;
            /* 填满卡片高度，使内部 game-frame-container 的 calc(100% - 73px) 生效 */
            height: 100%;
            position: relative;
        }

        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9eeef;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-icon {
            width: 32px;
            height: 32px;
            background: #667eea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .game-title {
            font-weight: 600;
            color: #333;
        }

        .game-status-bar {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .status-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .status-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            padding: 4px 8px;
            background: #f8f9fa;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
            border: 1px solid #e9eeef;
        }

        .status-value.updated {
            background: #d4edda;
            border-color: #c3e6cb;
            animation: statusUpdate 0.3s ease;
        }

        @keyframes statusUpdate {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .control-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .game-frame-container {
            /* 减去控制栏高度，确保iframe填满剩余空间 */
            height: calc(100% - 73px);
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .game-preview {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            overflow: hidden;
        }

        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #666;
        }

        .frame-overlay .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 游戏错误状态 */
        .game-error {
            display: none;
            padding: 40px;
            text-align: center;
        }

        .error-icon {
            font-size: 64px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .error-message {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* 通用错误状态 */
        .error-state {
            display: none;
            padding: 40px;
            text-align: center;
        }

        .error-state .error-icon {
            font-size: 64px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-state .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .error-state .error-message {
            color: #666;
            line-height: 1.5;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header {
                padding: 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .main-content {
                padding: 16px;
            }

            .game-controls {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .control-buttons {
                justify-content: center;
            }

            .config-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 全屏模式样式 */
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        .fullscreen-container .game-preview {
            width: 100%;
            height: 100%;
        }

        .fullscreen-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .fullscreen-controls .btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .fullscreen-controls .btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        .btn-info {
            background: #3b82f6;
            color: white;
        }
        
        .btn-info:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="page-title">加载中...</h1>
        <div class="meta" id="page-meta">正在初始化预览...</div>
    </header>

    <main class="main-content">
        <div class="container">
            <!-- 加载状态 -->
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <div class="loading-text">正在加载预览...</div>
            </div>

            <!-- SDK信息显示 -->
            <div id="sdk-info" class="sdk-info">
                <h2 class="section-title">SDK配置信息</h2>
                <div id="sdk-config-grid" class="config-grid">
                    <!-- SDK配置信息将在这里动态生成 -->
                </div>
            </div>

            <!-- 游戏预览容器 -->
            <div id="game-preview-container" class="game-preview-container">
                <div class="game-controls">
                    <div class="game-info">
                        <div class="game-icon">🎮</div>
                        <span class="game-title" id="game-title">游戏预览</span>
                    </div>
                    <div class="game-status-bar">
                        <div class="status-item">
                            <span class="status-label">游戏时长</span>
                            <span class="status-value" id="game-time-display">00:00</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">游戏分数</span>
                            <span class="status-value" id="game-score-display">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">游戏关卡</span>
                            <span class="status-value" id="game-level-display">1</span>
                        </div>
                    </div>
                   
                </div>
                <div class="game-frame-container">
                    <iframe id="game-preview" class="game-preview" 
                            title="游戏预览"
                            allowfullscreen
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock">
                    </iframe>
                    <div id="frame-loading" class="frame-overlay" style="display: none;">
                        <div class="icon">⏳</div>
                        <div>游戏加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 游戏错误状态 -->
            <div id="game-error" class="game-error">
                <div class="error-icon">⚠️</div>
                <h3 class="error-title">游戏预览不可用</h3>
                <p class="error-message">
                    该游戏可能尚未完成部署或配置。请联系管理员检查游戏状态。
                </p>
                <div class="error-actions">
                    <button class="btn btn-primary" onclick="prepareGame()">
                        🔧 准备游戏
                    </button>
                    <button class="btn btn-secondary" onclick="location.reload()">
                        🔄 重新加载
                    </button>
                </div>
            </div>

            <!-- 通用错误状态 -->
            <div id="error-state" class="error-state">
                <div class="error-icon">❌</div>
                <h3 class="error-title">加载失败</h3>
                <p id="error-message" class="error-message">发生未知错误</p>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="load.js"></script>
</body>
</html>
